name: Sync Release Data

# This workflow can be triggered from the main agentrium repo
# Add this step to your release.yml:
#
#   - name: Trigger website rebuild
#     uses: peter-evans/repository-dispatch@v3
#     with:
#       token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
#       repository: talayash/claude-terminal-website
#       event-type: new-release
#
# You'll need a PAT with repo scope stored as WEBSITE_DISPATCH_TOKEN

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch latest changelog from main repo
        run: |
          # -f fails the step on a 404/5xx instead of saving the error page.
          # The download lands in a temp file so a bad response never
          # overwrites the tracked changelog.
          curl -fsSL https://raw.githubusercontent.com/talayash/agentrium/master/src/changelog.json \
            -o "$RUNNER_TEMP/changelog.json"

      - name: Validate downloaded changelog
        run: |
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!Array.isArray(data) || data.length === 0) {
              console.error("changelog is not a non-empty array");
              process.exit(1);
            }
            for (const [i, entry] of data.entries()) {
              if (!entry || typeof entry !== "object" || typeof entry.version !== "string" || !entry.version) {
                console.error(`entry ${i} has no version field`);
                process.exit(1);
              }
            }
            console.log(`changelog ok: ${data.length} releases, latest ${data[0].version}`);
          ' "$RUNNER_TEMP/changelog.json"
          mv "$RUNNER_TEMP/changelog.json" src/data/changelog.json

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated changelog
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/changelog.json
          git commit -m "chore: sync changelog from main repo"
          git push
